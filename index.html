<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnapPlus</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/jpeg" href="images.jpg" />
</head>
<body>
  <div class="container">
    <div class="card">
      <img src="images.jpg" alt="SnapPlus Logo" class="logo" />
      <h1>Join on SnapPlus</h1>
      <p class="subtitle">Get free Snapchat Plus for a month when you sign up! Just enter your details below to get started.</p>

      <form id="signup-form">
        <div class="form-group">
          <label for="username">Snapchat Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="e.g. snapplus123"
            required
            maxlength="15"
            autocomplete="username"
            aria-required="true"
          />
          <span class="error-text" id="username-error" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="e.g. 07700 900123"
            required
            pattern="^\+?[0-9\s]+$"
            autocomplete="tel"
            aria-required="true"
          />
          <span class="error-text" id="phone-error" role="alert"></span>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">
          Continue
        </button>
      </form>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <footer>
        &copy; 2026 SnapPlus. All rights reserved.
      </footer>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
